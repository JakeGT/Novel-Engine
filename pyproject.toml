[project]
name = "novel-engine"
version = "0.1.0"
description = "AI-assisted long-form fiction planning and continuity engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.109.0",
  "httpx>=0.27",
  "joserfc>=1.0",
  "neo4j>=5.14.0",
  "openai>=1.10.0",
  "pgvector>=0.2",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=2.3.1",
  "sentry-sdk[fastapi]>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "requests>=2.31.0",
  "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "unit: deterministic test with no services, network, or persistent writes",
  "application: workflow test using in-memory ports and fakes",
  "contract: API or repository contract test, usually in-process",
  "integration: requires disposable external services such as PostgreSQL or Neo4j",
  "e2e: complete user workflow against disposable services",
  "llm: makes a live model-provider request",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# backend/services/world_service.py is a parked, user-owned edit whose world
# workflow is deferred (FND-008.23-27); it is excluded from lint/format until
# the owner reconciles it. Remove this exclusion when the world workflow lands.
extend-exclude = ["data", "backend/services/world_service.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/api/*.py" = ["B008"]
"backend/api/v1/*.py" = ["B008"]

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = ["backend", "*/site-packages"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["^\\.venv/", "^data/", "^frontend/"]
