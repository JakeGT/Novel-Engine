[project]
name = "novel-engine"
version = "0.1.0"
description = "AI-assisted long-form fiction planning and continuity engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "chromadb>=0.4.22",
  "fastapi>=0.109.0",
  "neo4j>=5.14.0",
  "openai>=1.10.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=2.3.1",
  "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "requests>=2.31.0",
  "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires external services such as Neo4j or an API server",
  "llm: makes a live model-provider request",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
