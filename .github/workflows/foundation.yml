name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main
      - phase-0-stabilization

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PNPM_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Scan tracked files for credentials
        run: python scripts/ci/secret_scan.py

  python-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Verify Python lock
        run: uv lock --check

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check backend tests

      - name: Check formatting
        run: uv run --locked ruff format --check backend tests

      - name: Type-check hermetic scope
        run: >
          uv run --locked mypy
          backend/graph/resolver.py
          backend/graph/summarizer.py
          backend/graph/policies.py
          backend/graph/schema.py

      - name: Run hermetic tests with coverage
        run: >
          uv run --locked pytest -m "not integration and not llm"
          --cov=backend --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Upload coverage and OpenAPI snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-foundation-artifacts
          path: |
            coverage.xml
            tests/contract/openapi_snapshot.json
          if-no-files-found: warn

  frontend-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.26.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Lint frontend
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novel_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel -d novel_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novel_engine
      NEO4J_URI: bolt://localhost:7687
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Apply migrations to disposable services
        run: uv run --locked python -m backend.migrate

      - name: Run integration tests
        run: uv run --locked pytest -m integration -q
