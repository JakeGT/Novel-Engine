name: Something is wrong
description: Novel Engine did something it should not, or did not do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please leave out your story's words, your provider keys and
        anything from `.env` or `secrets/`: describe the story instead ("a scene with two
        characters"). A security problem goes through SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in your own words. A screenshot helps if it shows no story text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a story and go to the plan
        2. Choose "Write this scene"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options:
        - On my own computer (make api and the web app)
        - Self-hosted with Docker
        - The hosted site
        - Other
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: The assistant
      description: Whether a model was involved. Many problems happen without one.
      options:
        - No model was involved
        - A local model (for example Ollama or LM Studio)
        - A provider with my own key (for example OpenRouter)
        - I am not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release, if you know it (`git rev-parse --short HEAD`).
  - type: textarea
    id: logs
    attributes:
      label: Log lines or error messages
      description: >-
        Novel Engine's logs carry event names and kinds of error, not your words, but check
        before pasting. `python -m backend.devtools.diagnostics` prints a bundle that is safe to
        share.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send it
      options:
        - label: I left out my story's words, my keys and anything from `.env` or `secrets/`.
          required: true
